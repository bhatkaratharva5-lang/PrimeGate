<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prime Publisher Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background: radial-gradient(circle at 50% 10%, #172554, #07090e 60%); color: #fff; min-height: 100vh; padding: 24px 16px; display: flex; align-items: center; justify-content: center; }
    .card { max-width: 480px; width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(20px); border-radius: 24px; padding: 30px; text-align: center; }
    h1 { font-size: 22px; margin-bottom: 6px; }
    p.sub { font-size: 13px; color: #94a3b8; margin-bottom: 22px; }
    .stats { display: flex; gap: 10px; margin-bottom: 20px; }
    .box { flex: 1; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08); padding: 12px; border-radius: 12px; }
    .box-val { font-size: 16px; font-weight: 800; color: #38bdf8; }
    .box-lbl { font-size: 11px; color: #94a3b8; }
    input { width: 100%; padding: 14px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; color: #fff; margin-bottom: 12px; outline: none; }
    button { width: 100%; padding: 14px; background: #2563eb; border: none; border-radius: 12px; color: #fff; font-weight: 700; cursor: pointer; }
    .output { display: none; margin-top: 16px; background: rgba(16,185,129,0.1); border: 1px solid #10b981; padding: 14px; border-radius: 12px; word-break: break-all; font-weight: 700; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Prime Portal Gateway</h1>
    <p class="sub">3-Step High-CPM Monetization Engine</p>
    <div class="stats">
      <div class="box"><div class="box-lbl">CPM RATE</div><div class="box-val">₹500 ($6)</div></div>
      <div class="box"><div class="box-lbl">MIN PAYOUT</div><div class="box-val">$1.00 (₹85)</div></div>
      <div class="box"><div class="box-lbl">PAYOUT GATE</div><div class="box-val">UPI / USDT</div></div>
    </div>
    <input type="text" id="targetCode" placeholder="Enter File Code (e.g. filexyz123)...">
    <input type="text" id="uploaderId" placeholder="Enter Telegram User ID...">
    <button onclick="makeLink()">Generate Monetized Link ➔</button>
    <div class="output" id="outBox"></div>
  </div>

  <script>
    function makeLink() {
      const code = document.getElementById('targetCode').value.trim();
      const u = document.getElementById('uploaderId').value.trim() || "0";
      if(!code) return alert("Enter a code");
      const url = `${window.location.origin}/step1.html?code=${encodeURIComponent(code)}&u=${encodeURIComponent(u)}`;
      const out = document.getElementById('outBox');
      out.innerText = url;
      out.style.display = 'block';
    }
  </script>
</body>
</html>
