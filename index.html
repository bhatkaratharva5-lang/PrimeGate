<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrimeGate — Verification Portal</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #0b0f19; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 16px; }
    .card { background: #131a2a; border: 1px solid #1e293b; border-radius: 16px; padding: 28px 20px; max-width: 420px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h1 { font-size: 1.4rem; margin-bottom: 8px; color: #38bdf8; }
    p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    .btn { display: inline-block; margin-top: 18px; background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff; padding: 13px 26px; border-radius: 10px; font-weight: 600; border: none; cursor: pointer; width: 100%; font-size: 1rem; }
    .tg-btn { display: block; box-sizing: border-box; margin-top: 12px; background: #1e293b; border: 1px solid #38bdf8; color: #38bdf8; padding: 11px 16px; border-radius: 10px; font-weight: 600; text-decoration: none; font-size: 0.92rem; }
    .footer-link { display: inline-block; margin-top: 16px; font-size: 0.82rem; color: #64748b; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>PrimeGate — Link Verification</h1>
    <p>Complete 3 quick verification steps (approx. 20 seconds) to unlock your destination link.</p>
    <button class="btn" onclick="startVerification()">Start Verification (Step 1/3)</button>
    <a href="https://t.me/PrimeXNetworkOfficial" target="_blank" rel="noopener noreferrer" class="tg-btn">Join Official Telegram Channel</a>
    <a href="stats.html" class="footer-link">Uploader Earnings Dashboard →</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token") || params.get("start");
    const uploader = params.get("u") || "admin";

    function startVerification() {
      if (!token) {
        alert("Invalid or missing link! Please open the verification link directly from Telegram.");
        return;
      }
      sessionStorage.setItem("pg_token", token);
      sessionStorage.setItem("pg_uploader", uploader);
      sessionStorage.setItem("pg_s1", "0");
      sessionStorage.setItem("pg_s2", "0");
      sessionStorage.setItem("pg_s3", "0");
      window.location.href = "step1.html";
    }
  </script>
</body>
</html>
