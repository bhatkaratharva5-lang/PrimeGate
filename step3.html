<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Step 3/3 - Final Unlock</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: radial-gradient(circle at 50% 10%, #064e3b, #07090e 65%); color: #f9fafb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px 16px; }
    .card { width: 100%; max-width: 420px; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 28px; padding: 32px 24px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75); }
    .badge { display: inline-block; padding: 6px 14px; background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.4); border-radius: 9999px; font-size: 12px; font-weight: 700; color: #34d399; text-transform: uppercase; margin-bottom: 18px; }
    h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 13px; color: #94a3b8; line-height: 1.5; margin-bottom: 24px; }
    .check-icon { font-size: 48px; color: #10b981; margin-bottom: 20px; }
    .btn { display: block; width: 100%; padding: 18px 0; border-radius: 16px; font-size: 16px; font-weight: 800; border: none; background: linear-gradient(135deg, #10b981, #059669); color: #ffffff; text-decoration: none; cursor: pointer; box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.5); }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">PrimeGate Final • Ready</div>
    <div class="check-icon">✓</div>
    <h2>Session Verified!</h2>
    <p>Your file is ready to download. Tap below to claim it immediately.</p>
    <button id="finalBtn" class="btn">Unlock File in Bot 🚀</button>
  </div>

  <script>
    const BOT_USERNAME = "FILE_STOREB_BOT";
    // Replace with your Monetag Direct Smartlink:
    const MONETAG_DIRECT_LINK = "https://otieuwou.net/4/YOUR_SMARTLINK_ID";

    const params = new URLSearchParams(window.location.search);
    const code = params.get('code') || "session";
    const uploader = params.get('u') || "0";

    const botReturnUrl = `https://t.me/${BOT_USERNAME}?start=v_${code}_u_${uploader}`;

    document.getElementById("finalBtn").addEventListener("click", () => {
      try {
        window.open(MONETAG_DIRECT_LINK, "_blank");
      } catch(e) {}
      window.location.href = botReturnUrl;
    });
  </script>
</body>
</html>
