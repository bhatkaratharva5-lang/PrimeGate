<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PrimeGate | Unlocked & Ready</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --glass: rgba(18, 24, 42, 0.65);
      --glass-card: rgba(28, 36, 62, 0.5);
      --border: rgba(255, 255, 255, 0.12);
      --blur: blur(24px);
      --emerald: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background: radial-gradient(circle at 50% 0%, #064e3b 0%, #070913 60%, #020408 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--glass-card);
      backdrop-filter: var(--blur);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px 18px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7);
      margin-top: 30px;
      text-align: center;
    }
    .check-icon {
      width: 58px; height: 58px;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid var(--emerald);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin: 0 auto 14px;
    }
    h1 { font-size: 21px; font-weight: 800; margin-bottom: 6px; }
    p.sub { font-size: 13px; color: #94a3b8; line-height: 1.5; margin-bottom: 18px; }

    .ad-box {
      width: 100%;
      background: rgba(0, 0, 0, 0.35);
      border: 1px dashed var(--border);
      border-radius: 16px;
      padding: 8px;
      margin: 16px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100px;
    }

    .btn-deliver {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: none;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-deliver:active { transform: scale(0.98); }
  </style>
</head>
<body>

  <div class="card">
    <div class="check-icon">✓</div>
    <h1>Verification Complete!</h1>
    <p class="sub">Your file pass is active. Tap below to receive your file in Telegram.</p>

    <!-- BEGIN AADS AD UNIT 2461720 -->
    <div class="ad-box">
      <div id="frame" style="width: 100%; margin: auto; position: relative;">
        <iframe data-aa='2461720' src='//acceptable.a-ads.com/2461720/?size=Adaptive' style='border:0; padding:0; width:100%; height:auto; overflow:hidden; display:block; margin:auto'></iframe>
      </div>
    </div>
    <!-- END AADS AD UNIT 2461720 -->

    <button class="btn-deliver" onclick="openBotFile()">
      🤖 Get File in Telegram Bot
    </button>
  </div>

  <script>
    const BOT_USERNAME = "FILE_STOREB_BOT";
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code') || 'session';
    const u = urlParams.get('u') || '0';

    function openBotFile() {
      const startPayload = `v_${code}_u_${u}`;
      window.location.href = `https://t.me/${BOT_USERNAME}?start=${encodeURIComponent(startPayload)}`;
    }
  </script>
</body>
</html>
