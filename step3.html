<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Step 3 of 3 — Unlock File</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #0b0f19; color: #f8fafc; padding: 16px; display: flex; flex-direction: column; align-items: center; }
    .container { max-width: 480px; width: 100%; text-align: center; }
    .badge { background: #064e3b; color: #34d399; padding: 6px 14px; border-radius: 999px; font-size: 0.85rem; font-weight: 600; display: inline-block; margin-bottom: 12px; }
    .ad-slot { background: #131a2a; border: 1px dashed #334155; border-radius: 10px; min-height: 60px; margin: 12px 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .ad-box { min-height: 250px; }
    .btn { background: #10b981; color: #064e3b; border: none; padding: 14px 24px; border-radius: 10px; font-size: 1rem; font-weight: 700; width: 100%; cursor: pointer; margin-top: 10px; }
    .btn:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }
    .tg-link { display: inline-block; margin-top: 14px; color: #38bdf8; text-decoration: none; font-size: 0.9rem; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">Final Step (3 of 3)</div>
    <h2>Generating Your File Link...</h2>

    <!-- LANA AD SLOT 1 (320x50) -->
    <div class="ad-slot"><!-- PASTE LANA 320x50 CODE --></div>

    <!-- LANA AD SLOT 2 (300x250) -->
    <div class="ad-slot ad-box"><!-- PASTE LANA 300x250 CODE --></div>

    <button id="unlockBtn" class="btn" disabled>Please wait 8s...</button>
    <a href="https://t.me/PrimeXNetworkOfficial" target="_blank" rel="noopener noreferrer" class="tg-link">Join Official Telegram (@PrimeXNetworkOfficial)</a>

    <!-- LANA AD SLOT 3 (320x50) -->
    <div class="ad-slot"><!-- PASTE LANA 320x50 CODE --></div>

    <!-- LANA AD SLOT 4 (300x250) -->
    <div class="ad-slot ad-box"><!-- PASTE LANA 300x250 CODE --></div>

    <!-- LANA AD SLOT 5 (320x50) -->
    <div class="ad-slot"><!-- PASTE LANA 320x50 CODE --></div>
  </div>

  <script>
    const WORKER_URL = "https://cf-worker-starter.bhatkaratharva5.workers.dev";

    const token = sessionStorage.getItem("pg_token");
    const uploader = sessionStorage.getItem("pg_uploader") || "admin";

    if (!token || sessionStorage.getItem("pg_s1") !== "1" || sessionStorage.getItem("pg_s2") !== "1") {
      window.location.href = "index.html";
    }

    let timeLeft = 8;
    const btn = document.getElementById("unlockBtn");

    const timer = setInterval(() => {
      timeLeft--;
      if (timeLeft > 0) {
        btn.textContent = `Please wait ${timeLeft}s...`;
      } else {
        clearInterval(timer);
        btn.disabled = false;
        btn.textContent = "Get File Link Now →";
      }
    }, 1000);

    btn.addEventListener("click", async () => {
      btn.disabled = true;
      btn.textContent = "Generating Secure Link...";
      sessionStorage.setItem("pg_s3", "1");

      try {
        const res = await fetch(
          `${WORKER_URL}/api/verify-final?token=${encodeURIComponent(token)}&u=${encodeURIComponent(uploader)}&s1=1&s2=1&s3=1`
        );
        const data = await res.json();

        if (data.success && data.redirectUrl) {
          sessionStorage.clear();
          window.location.href = data.redirectUrl;
        } else {
          alert(data.error || "Verification failed. Please restart from Telegram.");
        }
      } catch (err) {
        alert("Network error. Please try again.");
        btn.disabled = false;
        btn.textContent = "Get File Link Now →";
      }
    });
  </script>
</body>
</html>
