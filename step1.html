<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cloud File Gateway | Secure Access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070913;
      --card: rgba(22, 28, 48, 0.55);
      --border: rgba(255, 255, 255, 0.12);
      --accent: #6366f1;
      --cyan: #38bdf8;
      --text: #f8fafc;
      --text-sub: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg) 60%);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 14px;
      min-height: 100vh;
    }
    .wrapper { width: 100%; max-width: 440px; }

    .header-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .step-pill {
      font-size: 11px;
      font-weight: 800;
      color: var(--cyan);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .progress-track {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 16.6%;
      background: linear-gradient(90deg, #6366f1, var(--cyan));
      transition: width 0.3s ease;
    }

    /* 5 Ad Units Cleanly Spaced */
    .ad-card {
      width: 100%;
      background: rgba(0, 0, 0, 0.35);
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 6px;
      margin: 8px 0;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .article-card {
      background: var(--card);
      border: 1px solid var(--border);
      backdrop-filter: blur(20px);
      border-radius: 18px;
      padding: 16px;
      margin: 10px 0;
      box-shadow: 0 16px 36px -10px rgba(0,0,0,0.7);
    }
    .article-card h3 { font-size: 16px; font-weight: 800; color: #fff; margin-bottom: 6px; }
    .article-card p { font-size: 13px; color: var(--text-sub); line-height: 1.5; }

    /* Canvas Captcha for Step 5 */
    .captcha-wrap { display: none; margin: 12px 0; text-align: center; }
    canvas { background: #f8fafc; border-radius: 8px; display: block; margin: 0 auto; }
    input[type="text"] {
      width: 140px;
      padding: 9px;
      font-size: 16px;
      text-align: center;
      font-weight: 800;
      text-transform: uppercase;
      background: rgba(8, 12, 22, 0.8);
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 8px;
      margin-top: 10px;
      outline: none;
      letter-spacing: 2px;
    }

    .nav-btn {
      width: 100%;
      padding: 13px 18px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
      transition: opacity 0.2s, transform 0.1s;
    }
    .nav-btn:active { transform: scale(0.98); }
    .nav-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      filter: grayscale(0.8);
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="header-strip">
      <span class="step-pill" id="stepPill">STEP 1 OF 6</span>
      <span style="font-size:11px; color:var(--text-sub);" id="stepPercent">16%</span>
    </div>
    
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <!-- Ad Units 1 & 2 (Top) -->
    <div class="ad-card">
      <iframe data-aa='2461720' src='//acceptable.a-ads.com/2461720/?size=Adaptive' style='border:0; padding:0; width:100%; height:auto; overflow:hidden;'></iframe>
    </div>
    <div class="ad-card">
      <iframe data-aa='2461720' src='//acceptable.a-ads.com/2461720/?size=Adaptive' style='border:0; padding:0; width:100%; height:auto; overflow:hidden;'></iframe>
    </div>

    <!-- Micro Article Box -->
    <div class="article-card">
      <h3 id="stepTitle">Initializing Secure Transfer Gateway</h3>
      <p id="stepText">Decentralized cloud networks distribute data packets across fast edge nodes. Establishing a verified session guarantees smooth download speeds without server timeouts.</p>

      <!-- Captcha Component on Step 5 -->
      <div class="captcha-wrap" id="captchaWrap">
        <canvas id="captchaCanvas" width="220" height="65"></canvas>
        <input type="text" id="captchaInput" placeholder="ENTER CODE" maxlength="5" />
      </div>

      <button id="navActionBtn" class="nav-btn" onclick="executeStepTransition()">
        <span id="btnLabel">Preparing (3s)...</span>
        <span>➔</span>
      </button>
    </div>

    <!-- Ad Units 3, 4 & 5 (Bottom) -->
    <div class="ad-card">
      <iframe data-aa='2461720' src='//acceptable.a-ads.com/2461720/?size=Adaptive' style='border:0; padding:0; width:100%; height:auto; overflow:hidden;'></iframe>
    </div>
    <div class="ad-card">
      <iframe data-aa='2461720' src='//acceptable.a-ads.com/2461720/?size=Adaptive' style='border:0; padding:0; width:100%; height:auto; overflow:hidden;'></iframe>
    </div>
    <div class="ad-card">
      <iframe data-aa='2461720' src='//acceptable.a-ads.com/2461720/?size=Adaptive' style='border:0; padding:0; width:100%; height:auto; overflow:hidden;'></iframe>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const fileCode = urlParams.get('code') || 'demo_file';
    const BOT_USERNAME = "FILE_STOREB_BOT"; // Telegram Bot

    let currentStep = 1;
    let currentCaptcha = "";
    let stepTimer = null;

    const steps = [
      {
        pill: "STEP 1 OF 6: PROTOCOL CHECK",
        percent: "16%",
        title: "Initializing Secure Transfer Gateway",
        text: "Decentralized cloud networks distribute data packets across fast edge nodes. Establishing a verified session guarantees smooth download speeds without server timeouts.",
        btn: "Continue to Step 2"
      },
      {
        pill: "STEP 2 OF 6: BUFFERING",
        percent: "33%",
        title: "Dynamic Bitrate Compression",
        text: "Transport channels automatically engage lossless gzip stream compression. This preserves bandwidth across standard 4G and 5G cellular networks.",
        btn: "Go to Step 3"
      },
      {
        pill: "STEP 3 OF 6: CHECKSUM",
        percent: "50%",
        title: "Cryptographic Data Matching",
        text: "Direct end-to-end checksum validations ensure data integrity. Files are cached securely before being delivered to your client application.",
        btn: "Proceed to Step 4"
      },
      {
        pill: "STEP 4 OF 6: SECURITY NODE",
        percent: "66%",
        title: "Protection Against Bot Scrapers",
        text: "Automated scrapers frequently exhaust bandwidth allocations. Multi-layer gateway verifications maintain high link stability for authentic community members.",
        btn: "Solve Image Check (Step 5)"
      },
      {
        pill: "STEP 5 OF 6: HUMAN VERIFY",
        percent: "83%",
        title: "Human Image Verification",
        text: "Type the distorted letters shown in the verification box below to validate your download session token:",
        btn: "Verify & Unlock"
      },
      {
        pill: "STEP 6 OF 6: COMPLETE",
        percent: "100%",
        title: "Session Authorization Confirmed",
        text: "Handshake verified. Click the button below to launch Telegram and retrieve your file directly from the bot.",
        btn: "Get File in Telegram"
      }
    ];

    function generateCaptcha() {
      const canvas = document.getElementById('captchaCanvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#f8fafc";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const chars = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
      currentCaptcha = "";
      for (let i = 0; i < 5; i++) {
        currentCaptcha += chars.charAt(Math.floor(Math.random() * chars.length));
      }

      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.moveTo(Math.random()*canvas.width, Math.random()*canvas.height);
        ctx.lineTo(Math.random()*canvas.width, Math.random()*canvas.height);
        ctx.strokeStyle = "#475569";
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }

      for (let i = 0; i < currentCaptcha.length; i++) {
        ctx.save();
        ctx.font = "bold 26px sans-serif";
        ctx.fillStyle = ["#0f172a", "#1e3a8a", "#065f46", "#831843"][i % 4];
        ctx.translate(22 + (i * 36), 42 + (Math.random()-0.5)*6);
        ctx.rotate((Math.random() - 0.5) * 0.4);
        ctx.fillText(currentCaptcha[i], 0, 0);
        ctx.restore();
      }
    }

    function startStepTimer() {
      const btn = document.getElementById('navActionBtn');
      const label = document.getElementById('btnLabel');

      if (stepTimer) clearInterval(stepTimer);

      if (currentStep === 5 || currentStep === 6) {
        btn.disabled = false;
        label.innerText = steps[currentStep - 1].btn;
        return;
      }

      btn.disabled = true;
      let countdown = 3;
      label.innerText = `Preparing (${countdown}s)...`;

      stepTimer = setInterval(() => {
        countdown--;
        if (countdown > 0) {
          label.innerText = `Preparing (${countdown}s)...`;
        } else {
          clearInterval(stepTimer);
          btn.disabled = false;
          label.innerText = steps[currentStep - 1].btn;
        }
      }, 1000);
    }

    function executeStepTransition() {
      if (currentStep === 5) {
        const val = document.getElementById('captchaInput').value.trim().toUpperCase();
        if (val !== currentCaptcha) {
          alert("Incorrect code! Please try again.");
          generateCaptcha();
          return;
        }
      }

      if (currentStep === 6) {
        window.location.href = `https://t.me/${BOT_USERNAME}?start=PASS_${fileCode}`;
        return;
      }

      currentStep++;
      const currentData = steps[currentStep - 1];

      document.getElementById('stepPill').innerText = currentData.pill;
      document.getElementById('stepPercent').innerText = currentData.percent;
      document.getElementById('progressFill').style.width = ((currentStep / 6) * 100) + "%";
      document.getElementById('stepTitle').innerText = currentData.title;
      document.getElementById('stepText').innerText = currentData.text;

      if (currentStep === 5) {
        document.getElementById('captchaWrap').style.display = "block";
        generateCaptcha();
      } else {
        document.getElementById('captchaWrap').style.display = "none";
      }

      startStepTimer();
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    startStepTimer();
  </script>
</body>
</html>
