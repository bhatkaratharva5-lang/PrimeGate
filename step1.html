<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PrimeGate | Verification Step 1/3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --glass: rgba(18, 24, 42, 0.65);
      --glass-card: rgba(28, 36, 62, 0.5);
      --border: rgba(255, 255, 255, 0.12);
      --blur: blur(24px);
      --accent: #6366f1;
      --cyan: #38bdf8;
      --emerald: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #070913 60%, #020408 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }
    .top-pill {
      background: var(--glass);
      backdrop-filter: var(--blur);
      border: 1px solid var(--border);
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      color: var(--cyan);
      margin-bottom: 16px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--glass-card);
      backdrop-filter: var(--blur);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 22px 18px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7);
      margin-bottom: 16px;
    }
    .step-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      background: rgba(99, 102, 241, 0.25);
      border: 1px solid var(--accent);
      color: #c7d2fe;
      padding: 4px 12px;
      border-radius: 99px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    h1 { font-size: 19px; font-weight: 800; margin-bottom: 6px; }
    p.sub { font-size: 12.5px; color: #94a3b8; line-height: 1.5; margin-bottom: 16px; }

    /* A-ADS EMBED BOX */
    .ad-box {
      width: 100%;
      background: rgba(0, 0, 0, 0.35);
      border: 1px dashed var(--border);
      border-radius: 16px;
      padding: 8px;
      margin: 14px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100px;
    }

    .timer-wrap {
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      text-align: center;
      margin-bottom: 16px;
    }
    .timer-num { font-size: 30px; font-weight: 800; font-family: 'JetBrains Mono', monospace; color: var(--cyan); }
    .timer-lbl { font-size: 11px; color: #94a3b8; font-weight: 600; text-transform: uppercase; }

    .btn {
      width: 100%;
      padding: 15px;
      border-radius: 16px;
      border: none;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      display: none;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
    }
    .btn:active { transform: scale(0.98); }
  </style>
</head>
<body>

  <div class="top-pill">🛡️ PrimeGate Secure Gateway</div>

  <div class="card">
    <span class="step-badge">Security Check 1 of 3</span>
    <h1>Human Verification</h1>
    <p class="sub">Verify your session to unlock access to the requested Telegram media file.</p>

    <!-- BEGIN AADS AD UNIT 2461720 -->
    <div class="ad-box">
      <div id="frame" style="width: 100%; margin: auto; position: relative;">
        <iframe data-aa='2461720' src='//acceptable.a-ads.com/2461720/?size=Adaptive' style='border:0; padding:0; width:100%; height:auto; overflow:hidden; display:block; margin:auto'></iframe>
      </div>
    </div>
    <!-- END AADS AD UNIT 2461720 -->

    <div class="timer-wrap" id="timerBox">
      <div class="timer-num" id="timeCount">10</div>
      <div class="timer-lbl">Please wait for link verification...</div>
    </div>

    <button class="btn" id="nextBtn" onclick="goNext()">Proceed to Step 2 ➔</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code') || '';
    const u = urlParams.get('u') || '';

    let sec = 10;
    const timeCount = document.getElementById('timeCount');
    const timerBox = document.getElementById('timerBox');
    const nextBtn = document.getElementById('nextBtn');

    const countdown = setInterval(() => {
      sec--;
      if (sec > 0) {
        timeCount.innerText = sec;
      } else {
        clearInterval(countdown);
        timerBox.style.display = 'none';
        nextBtn.style.display = 'block';
      }
    }, 1000);

    function goNext() {
      window.location.href = `step2.html?code=${encodeURIComponent(code)}&u=${encodeURIComponent(u)}`;
    }
  </script>
</body>
</html>
