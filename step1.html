<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Step 1 of 3 — PrimeGate</title>
  <!-- LANA NETWORK POPUNDER TAG -->
  <script src="https://fieldwren.com/t.js" data-z="z974cf6c5" async></script>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #0b0f19; color: #f8fafc; padding: 16px; display: flex; flex-direction: column; align-items: center; }
    .container { max-width: 480px; width: 100%; text-align: center; }
    .badge { background: #1e293b; color: #38bdf8; padding: 6px 14px; border-radius: 999px; font-size: 0.85rem; font-weight: 600; display: inline-block; margin-bottom: 12px; }
    .info-box { background: #131a2a; border: 1px solid #1e293b; border-radius: 12px; padding: 20px; margin: 16px 0; color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    .btn { background: #2563eb; color: #fff; border: none; padding: 14px 24px; border-radius: 10px; font-size: 1rem; font-weight: 600; width: 100%; cursor: pointer; margin-top: 10px; }
    .btn:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }
    .tg-link { display: inline-block; margin-top: 14px; color: #38bdf8; text-decoration: none; font-size: 0.9rem; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">Step 1 of 3</div>
    <h2>Please Wait While Verifying...</h2>

    <div class="info-box">
      Verifying your session security. Please wait for the timer to complete before proceeding to Step 2.
    </div>

    <button id="nextBtn" class="btn" disabled>Please wait 8s...</button>
    <a href="https://t.me/PrimeXNetworkOfficial" target="_blank" rel="noopener noreferrer" class="tg-link">Join Official Telegram (@PrimeXNetworkOfficial)</a>
  </div>

  <script>
    if (!sessionStorage.getItem("pg_token")) {
      window.location.href = "index.html";
    }

    let timeLeft = 8;
    const btn = document.getElementById("nextBtn");

    const timer = setInterval(() => {
      timeLeft--;
      if (timeLeft > 0) {
        btn.textContent = `Please wait ${timeLeft}s...`;
      } else {
        clearInterval(timer);
        btn.disabled = false;
        btn.textContent = "Continue to Step 2 →";
      }
    }, 1000);

    btn.addEventListener("click", () => {
      sessionStorage.setItem("pg_s1", "1");
      window.location.href = "step2.html";
    });
  </script>
</body>
</html>
