<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Step 6/6 | Handshake Complete</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070913;
      --card: rgba(22, 28, 48, 0.55);
      --border: rgba(255, 255, 255, 0.12);
      --emerald: #10b981;
      --text: #f8fafc;
      --text-sub: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      background: radial-gradient(circle at 50% 0%, #064e3b 0%, var(--bg) 60%);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 14px;
      min-height: 100vh;
    }
    .wrapper { width: 100%; max-width: 440px; }
    .header-strip { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .step-pill { font-size: 11px; font-weight: 800; color: var(--emerald); letter-spacing: 0.5px; text-transform: uppercase; }
    .progress-track { width: 100%; height: 5px; background: rgba(255, 255, 255, 0.08); border-radius: 99px; margin-bottom: 12px; overflow: hidden; }
    .progress-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #10b981, #059669); }
    .ad-card { width: 100%; background: rgba(0, 0, 0, 0.35); border: 1px dashed var(--border); border-radius: 12px; padding: 4px; margin: 8px 0; min-height: 60px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .article-card { background: var(--card); border: 1px solid var(--border); backdrop-filter: blur(20px); border-radius: 18px; padding: 20px 16px; margin: 10px 0; text-align: center; }
    .badge-icon { font-size: 38px; margin-bottom: 8px; }
    .article-card h3 { font-size: 18px; font-weight: 800; color: #fff; margin-bottom: 6px; }
    .article-card p { font-size: 13px; color: var(--text-sub); line-height: 1.5; margin-bottom: 16px; }
    .nav-btn { width: 100%; padding: 15px 18px; background: linear-gradient(135deg, #10b981, #059669); color: #fff; font-size: 15px; font-weight: 800; border: none; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 8px 24px rgba(16, 185, 129, 0.4); }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="header-strip">
      <span class="step-pill">STEP 6 OF 6: VERIFIED</span>
      <span style="font-size:11px; color:var(--emerald);">100%</span>
    </div>
    
    <div class="progress-track">
      <div class="progress-fill"></div>
    </div>

    <!-- Top 2 Banners -->
    <div class="ad-card"><iframe data-aa='2461720' src='//acceptable.a-ads.com/2461720/?size=Adaptive' style='border:0;padding:0;width:100%;height:auto;overflow:hidden;'></iframe></div>
    <div class="ad-card"><iframe data-aa='2461720' src='//acceptable.a-ads.com/2461720/?size=Adaptive' style='border:0;padding:0;width:100%;height:auto;overflow:hidden;'></iframe></div>

    <div class="article-card">
      <div class="badge-icon">✅</div>
      <h3>Handshake Complete</h3>
      <p>Your session key has been authorized by the gateway. Tap the button below to claim your original file directly inside Telegram.</p>

      <button id="navBtn" class="nav-btn" onclick="returnToTelegram()">
        <span>Claim File in Bot</span>
        <span>➔</span>
      </button>
    </div>

    <!-- Bottom 3 Banners -->
    <div class="ad-card"><iframe data-aa='2461720' src='//acceptable.a-ads.com/2461720/?size=Adaptive' style='border:0;padding:0;width:100%;height:auto;overflow:hidden;'></iframe></div>
    <div class="ad-card"><iframe data-aa='2461720' src='//acceptable.a-ads.com/2461720/?size=Adaptive' style='border:0;padding:0;width:100%;height:auto;overflow:hidden;'></iframe></div>
    <div class="ad-card"><iframe data-aa='2461720' src='//acceptable.a-ads.com/2461720/?size=Adaptive' style='border:0;padding:0;width:100%;height:auto;overflow:hidden;'></iframe></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code') || 'demo_file';
    const BOT_USERNAME = "FILE_STOREB_BOT"; // Telegram Bot

    function returnToTelegram() {
      window.location.href = `https://t.me/${BOT_USERNAME}?start=PASS_${encodeURIComponent(code)}`;
    }
  </script>
</body>
</html>
