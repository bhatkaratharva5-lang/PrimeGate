<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Step 2 of 3 — PrimeGate</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #0b0f19; color: #f8fafc; padding: 16px; display: flex; flex-direction: column; align-items: center; }
    .container { max-width: 480px; width: 100%; text-align: center; }
    .badge { background: #1e293b; color: #38bdf8; padding: 6px 14px; border-radius: 999px; font-size: 0.85rem; font-weight: 600; display: inline-block; margin-bottom: 12px; }
    .ad-slot { background: #131a2a; border: 1px dashed #334155; border-radius: 10px; min-height: 60px; margin: 12px 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .ad-box { min-height: 250px; }
    .btn { background: #2563eb; color: #fff; border: none; padding: 14px 24px; border-radius: 10px; font-size: 1rem; font-weight: 600; width: 100%; cursor: pointer; margin-top: 10px; }
    .btn:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }
    .tg-link { display: inline-block; margin-top: 14px; color: #38bdf8; text-decoration: none; font-size: 0.9rem; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">Step 2 of 3</div>
    <h2>Checking Security Session...</h2>

    <!-- LANA AD SLOT 1 (320x50) -->
    <div class="ad-slot"><!-- PASTE LANA 320x50 CODE --></div>

    <!-- LANA AD SLOT 2 (300x250) -->
    <div class="ad-slot ad-box"><!-- PASTE LANA 300x250 CODE --></div>

    <button id="nextBtn" class="btn" disabled>Please wait 8s...</button>
    <a href="https://t.me/PrimeXNetworkOfficial" target="_blank" rel="noopener noreferrer" class="tg-link">Join Official Telegram (@PrimeXNetworkOfficial)</a>

    <!-- LANA AD SLOT 3 (320x50) -->
    <div class="ad-slot"><!-- PASTE LANA 320x50 CODE --></div>

    <!-- LANA AD SLOT 4 (300x250) -->
    <div class="ad-slot ad-box"><!-- PASTE LANA 300x250 CODE --></div>

    <!-- LANA AD SLOT 5 (320x50) -->
    <div class="ad-slot"><!-- PASTE LANA 320x50 CODE --></div>
  </div>

  <script>
    if (!sessionStorage.getItem("pg_token") || sessionStorage.getItem("pg_s1") !== "1") {
      window.location.href = "index.html";
    }

    let timeLeft = 8;
    const btn = document.getElementById("nextBtn");

    const timer = setInterval(() => {
      timeLeft--;
      if (timeLeft > 0) {
        btn.textContent = `Please wait ${timeLeft}s...`;
      } else {
        clearInterval(timer);
        btn.disabled = false;
        btn.textContent = "Continue to Final Step →";
      }
    }, 1000);

    btn.addEventListener("click", () => {
      sessionStorage.setItem("pg_s2", "1");
      window.location.href = "step3.html";
    });
  </script>
</body>
</html>
